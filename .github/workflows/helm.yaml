name: Helm

on:
  workflow_call:
    inputs:
      golang_version:
        required: true
        type: string

jobs:
  test-helm-version:
    name: Test (Helm ${{ matrix.helm_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14.4 is the version the release workflows package the chart with. The newer
        # version is pinned because setup-helm silently installs v3.18.4 if resolving
        # "latest" fails.
        helm_version:
          - 3.14.4
          - 4.3.0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.golang_version }}
    - name: Install Helm
      uses: azure/setup-helm@v5.0.1
      with:
        version: ${{ matrix.helm_version }}
    - name: Check values.schema.json is up to date
      run: make check-helm-values-schema
    - name: Lint chart
      run: make lint-helm
    - run: make test-helm

  # Branch protection requires a check named "Test", which a matrix job never reports.
  test:
    name: Test
    needs:
    - test-helm-version
    # A skipped job satisfies a required check, so run even when a Helm version failed.
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check that every Helm version passed
      env:
        HELM_VERSION_TESTS_RESULT: ${{ needs.test-helm-version.result }}
      run: test "$HELM_VERSION_TESTS_RESULT" = success
